<!DOCTYPE html>
<html lang="en" data-theme="parchment">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Characters — D&D 5e Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script>(function(){const t=localStorage.getItem('dnd5e_theme');if(t&&t!=='parchment')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root{--parchment:#f5edd6;--surface:#fdf6e3;--surface2:#f0e2b6;--border:#c9a84c;--ink:#2c1a0e;--ink-light:#5c3d1e;--gold:#b8860b;--gold-light:#d4a017;--red:#8b1a1a;--on-accent:#fff;--muted:#7a5c3a;--green:#2d7a2d;--nav-bg:#2c1810;--nav-text:#f5e6d0;--nav-accent:#c9a84c;}
  [data-theme="midnight"]{--parchment:#1a1a2e;--ink:#e2e4e7;--ink-light:#a0a8b2;--gold:#c9a84c;--gold-light:#e8c86a;--red:#b0c4d8;--on-accent:#1a1a2e;--border:#3d3555;--surface:#22223a;--surface2:#2c2c4a;--muted:#8a8099;--green:#4caf7d;--nav-bg:#0d0d1a;--nav-text:#e2e4e7;--nav-accent:#b0c4d8;}
  [data-theme="arcane"]{--parchment:#12102a;--ink:#e8d5f5;--ink-light:#c4a8e0;--gold:#9b59b6;--gold-light:#b07fd4;--red:#e0c055;--on-accent:#12102a;--border:#5a3d7a;--surface:#1a1638;--surface2:#241e50;--muted:#8a7aa8;--green:#58d68d;--nav-bg:#0a0818;--nav-text:#e8d5f5;--nav-accent:#e0c055;}
  [data-theme="forest"]{--parchment:#0f1a12;--ink:#d4e8c4;--ink-light:#9fc28f;--gold:#7daa3f;--gold-light:#9acf50;--red:#90cc58;--on-accent:#0f1a12;--border:#3a6a3a;--surface:#182a1a;--surface2:#213522;--muted:#6a9060;--green:#6bdb7e;--nav-bg:#080f08;--nav-text:#d4e8c4;--nav-accent:#90cc58;}
  [data-theme="iron"]{--parchment:#0e0e0e;--ink:#f0f0f0;--ink-light:#c8c8c8;--gold:#e8c84a;--gold-light:#f0dc6e;--red:#e84040;--on-accent:#fff;--border:#505050;--surface:#1a1a1a;--surface2:#242424;--muted:#909090;--green:#44ee88;--nav-bg:#000;--nav-text:#f0f0f0;--nav-accent:#e84040;}
  /* Theme dots */
  .theme-dots{display:flex;gap:5px;align-items:center;}
  .theme-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .1s;}
  .theme-dot.active,.theme-dot:hover{border-color:#fff;transform:scale(1.15);}
  /* Auth wall */
  #authWall{position:fixed;inset:0;background:var(--parchment);z-index:999;display:flex;align-items:center;justify-content:center;padding:2rem;flex-direction:column;}
  #authWall.hidden{display:none;}
  .auth-wall-inner{display:flex;flex-direction:column;align-items:center;gap:1.25rem;width:100%;max-width:400px;}
  .auth-wall-brand{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;color:var(--ink);text-align:center;}
  .auth-wall-sub{font-size:1rem;color:var(--ink-light);font-style:italic;text-align:center;margin-top:.25rem;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Crimson Text',Georgia,serif;background:var(--parchment);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
  /* Nav */
  .top-nav{position:sticky;top:0;z-index:100;height:50px;background:var(--nav-bg);border-bottom:2px solid rgba(255,255,255,.15);display:flex;align-items:center;}
  .top-nav-inner{width:100%;max-width:1200px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;gap:1rem;}
  .top-nav-brand{font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:var(--nav-accent);letter-spacing:1px;white-space:nowrap;text-decoration:none;}
  .top-nav-links{display:flex;gap:4px;margin-left:8px;align-items:center;}
  .top-nav-link{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.5px;color:var(--nav-text);text-decoration:none;padding:5px 10px;border-radius:4px;opacity:.75;transition:opacity .15s,background .15s;background:none;border:none;cursor:pointer;}
  .top-nav-link:hover{opacity:1;background:rgba(255,255,255,.08);}
  .top-nav-link.active{opacity:1;color:var(--nav-accent);font-weight:600;}
  /* Characters dropdown */
  .nav-dropdown{position:relative;display:inline-flex;}
  .nav-char-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:250px;max-width:310px;max-height:380px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:2000;scrollbar-width:thin;}
  .nav-char-menu.open{display:block;}
  .nav-char-tile{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);}
  .nav-char-info{flex:1;min-width:0;}
  .nav-char-name{font-family:'Cinzel',serif;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .nav-char-sub{font-size:11px;color:var(--muted);}
  .nav-char-actions{display:flex;gap:3px;flex-shrink:0;}
  .nav-char-action{font-family:'Cinzel',serif;font-size:10px;padding:2px 7px;border:1px solid var(--border);border-radius:3px;text-decoration:none;color:var(--ink);background:var(--surface2);white-space:nowrap;cursor:pointer;}
  .nav-char-action:hover{background:var(--border);}
  .nav-char-empty{padding:10px 12px;font-size:12px;color:var(--muted);font-style:italic;}
  .nav-char-footer{display:block;padding:7px 12px;font-family:'Cinzel',serif;font-size:11px;color:var(--gold);text-decoration:none;font-weight:600;border-top:1px solid var(--border);}
  .nav-char-footer:hover{background:var(--surface2);}
  .nav-char-footer+.nav-char-footer{border-top:none;padding-top:2px;padding-bottom:7px;}
  /* Page */
  .page{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:2rem 1.5rem;}
  .page-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:.75rem;}
  .page-title{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;color:var(--ink);}
  .btn-create{font-family:'Cinzel',serif;font-size:12px;font-weight:600;padding:8px 18px;background:var(--gold);color:#fff;border:none;border-radius:5px;text-decoration:none;cursor:pointer;transition:opacity .15s;}
  .btn-create:hover{opacity:.85;}
  /* Grid */
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem;}
  /* Card */
  .char-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.25rem 1.25rem 1rem;display:flex;flex-direction:column;gap:.75rem;transition:border-color .2s,box-shadow .2s;}
  .char-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(139,105,20,.12);}
  .char-card-header{display:flex;align-items:flex-start;gap:.5rem;}
  .char-avatar{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  .char-card-info{flex:1;min-width:0;}
  .char-card-name{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .char-card-sub{font-size:.9rem;color:var(--ink-light);margin-top:1px;}
  .char-card-meta{font-size:.8rem;color:var(--muted);font-style:italic;}
  .char-card-actions{display:flex;gap:.5rem;margin-top:.25rem;}
  .char-btn{font-family:'Cinzel',serif;font-size:11px;padding:5px 12px;border-radius:4px;text-decoration:none;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--ink);transition:background .15s;}
  .char-btn:hover{background:var(--border);}
  .char-btn-del{border-color:transparent;background:transparent;color:var(--muted);margin-left:auto;padding:5px 8px;line-height:0;}
  .char-btn-del:hover{color:var(--red);background:rgba(139,26,26,.06);}
  .char-btn-del svg{display:block;}
  /* Empty state */
  .empty{text-align:center;padding:4rem 2rem;}
  .empty-icon{font-size:3rem;margin-bottom:1rem;}
  .empty-title{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:600;color:var(--ink);margin-bottom:.5rem;}
  .empty-sub{font-size:.95rem;color:var(--ink-light);margin-bottom:1.5rem;}
  /* Divider */
  .divider{width:200px;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:0 auto 1.5rem;}
  /* Auth */
  .top-nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .auth-bar{display:flex;align-items:center;gap:8px;}
  .auth-email{font-size:12px;color:var(--nav-text);opacity:.8;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btn{font-family:'Cinzel',serif;font-size:13px;padding:7px 16px;border-radius:4px;border:1px solid transparent;cursor:pointer;transition:filter .15s;font-weight:600;white-space:nowrap;}
  .btn-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .btn-gold:hover{filter:brightness(.88);}
  .btn-ghost{background:transparent;color:var(--nav-text);border-color:rgba(255,255,255,.3);}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn-red{background:var(--red);color:#fff;border-color:var(--red);}
  .btn-red:hover{filter:brightness(.88);}
  .btn-sm{font-size:11px;padding:4px 10px;}
  .auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300;}
  .auth-modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.75rem;min-width:320px;max-width:420px;width:90%;}
  .auth-modal h3{font-family:'Cinzel',serif;font-size:1.1rem;margin-bottom:1rem;color:var(--ink);}
  .auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem;}
  .auth-tab{background:none;border:none;padding:6px 14px;font-family:'Cinzel',serif;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .auth-tab.active{color:var(--red);border-bottom-color:var(--red);}
  .auth-field{margin-bottom:12px;}
  .auth-field label{font-size:12px;font-weight:600;color:var(--ink-light);display:block;margin-bottom:4px;}
  .auth-field input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:14px;font-family:inherit;}
</style>
</head>
<body>
<nav class="top-nav">
  <div class="top-nav-inner">
    <a class="top-nav-brand" href="index.html">⚔ D&D 5e Tools</a>
    <div class="top-nav-links">
      <a class="top-nav-link" href="index.html">Home</a>
      <div class="nav-dropdown">
        <button class="top-nav-link active" onclick="toggleNavCharMenu(event)">Characters ▾</button>
        <div class="nav-char-menu" id="navCharMenu"></div>
      </div>
      <a class="top-nav-link" href="campaigns.html">Campaigns</a>
    </div>
    <div class="top-nav-right"><div class="theme-dots" id="themeDots"></div><div id="authBar"></div></div>
  </div>
</nav>
<div id="authWall">
  <div class="auth-wall-inner">
    <div style="text-align:center;">
      <div style="font-size:2.5rem;margin-bottom:.5rem;">&#9876;&#65039;</div>
      <div class="auth-wall-brand">D&amp;D 5e Tools</div>
      <div class="auth-wall-sub">Sign in to access your characters &amp; campaigns</div>
    </div>
    <div class="auth-modal" style="width:100%;box-shadow:0 4px 24px rgba(0,0,0,.12);">
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="signin" onclick="_wallMode='signin';_renderWall()">Sign In</button>
        <button class="auth-tab" data-mode="signup" onclick="_wallMode='signup';_renderWall()">Create Account</button>
      </div>
      <div class="auth-field"><label>Email</label><input type="email" id="wall-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')document.getElementById('wall-pass').focus()"/></div>
      <div class="auth-field"><label>Password</label><input type="password" id="wall-pass" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" onkeydown="if(event.key==='Enter')doWallAuth()"/></div>
      <div id="wall-msg" style="min-height:18px;font-size:12px;color:var(--red);margin-bottom:2px;"></div>
      <button class="btn btn-red" id="wallAuthBtn" style="width:100%;margin-top:2px;" onclick="doWallAuth()">Sign In</button>
    </div>
  </div>
</div>
<div class="page">
  <div class="page-header">
    <h1 class="page-title">My Characters</h1>
    <a class="btn-create" href="builder.html">+ New Character</a>
  </div>
  <div id="charGrid"></div>
</div>
<script>
const CharStore={
  _idx(){try{return JSON.parse(localStorage.getItem('dnd5e_chars')||'[]');}catch(e){return[];}},
  _saveIdx(arr){try{localStorage.setItem('dnd5e_chars',JSON.stringify(arr));}catch(e){}},
  index(){
    const idx=this._idx();
    if(idx.length)return idx;
    // Fallback: scan dnd5e_char_* keys to rebuild list if index is missing
    const found=[];const seen=new Set();
    try{
      for(let i=0;i<localStorage.length;i++){
        const key=localStorage.key(i);
        if(!key||!key.startsWith('dnd5e_char_'))continue;
        const id=key.slice('dnd5e_char_'.length);
        if(seen.has(id))continue;seen.add(id);
        try{
          const raw=JSON.parse(localStorage.getItem(key)||'{}');
          const b=raw.builder,t=raw.tracker;
          const name=(b&&b.name)||(t&&t.identity&&t.identity.name)||'Unnamed';
          const classId=(b&&b.class)||(t&&t.class&&t.class.id)||null;
          const level=(b&&b.level)||(t&&t.level)||1;
          const updatedAt=(b&&b.updatedAt)||(t&&t.updatedAt)||null;
          if(name!=='Unnamed'||classId)found.push({id,name,classId,level,updatedAt});
        }catch(e){}
      }
    }catch(e){}
    // Write rebuilt index back so future reads are fast
    if(found.length)this._saveIdx(found);
    return found;
  },
  genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);},
  loadPart(id,part){
    try{const raw=localStorage.getItem('dnd5e_char_'+id);if(!raw)return null;return JSON.parse(raw)[part]??null;}catch(e){return null;}
  },
  loadFull(id){
    try{const raw=localStorage.getItem('dnd5e_char_'+id);return raw?JSON.parse(raw):null;}catch(e){return null;}
  },
  saveFull(id,data){
    try{localStorage.setItem('dnd5e_char_'+id,JSON.stringify(data));}catch(e){}
  },
  delete(id){
    this._saveIdx(this._idx().filter(c=>c.id!==id));
    try{localStorage.removeItem('dnd5e_char_'+id);}catch(e){}
    try{const a=localStorage.getItem('dnd5e_active');if(a===id)localStorage.removeItem('dnd5e_active');}catch(e){}
  }
};

function _relDate(iso){
  if(!iso)return'Never';
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000);
  if(m<1)return'Just now';
  if(m<60)return m+'m ago';
  const h=Math.floor(m/60);
  if(h<24)return h+'h ago';
  const d=Math.floor(h/24);
  if(d<7)return d+'d ago';
  return new Date(iso).toLocaleDateString();
}

function _classIcon(classId){
  const icons={fighter:'⚔️',wizard:'🧙',rogue:'🗡️',cleric:'✝️',ranger:'🏹',paladin:'🛡️',druid:'🌿',bard:'🎵',monk:'👊',barbarian:'🪓',sorcerer:'✨',warlock:'🌑'};
  return icons[classId]||'📜';
}

function _clsLabel(classId){
  if(!classId||typeof classId!=='string')return'';
  return classId.charAt(0).toUpperCase()+classId.slice(1);
}

function _charCard(c,isDraft){
  const cl=_clsLabel(c.classId);
  const safeName=(c.name||'Unnamed').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  const safeId=String(c.id||'');
  return`<div class="char-card"${isDraft?' style="opacity:.88;"':''}>
    <div class="char-card-header">
      <div class="char-avatar">${_classIcon(c.classId)}</div>
      <div class="char-card-info">
        <div class="char-card-name">${c.name||'Unnamed'}${isDraft?` <span style="font-size:10px;font-family:'Cinzel',serif;color:var(--gold);border:1px solid var(--gold);padding:1px 5px;border-radius:3px;letter-spacing:.5px;vertical-align:middle;">DRAFT</span>`:''}
        </div>
        <div class="char-card-sub">${cl?cl+' &middot; ':''}Level ${c.level||1}</div>
      </div>
    </div>
    <div class="char-card-meta">${isDraft?'Last edited: ':'Last played: '}${_relDate(c.updatedAt)}</div>
    <div class="char-card-actions">
      <a class="char-btn" href="builder.html?char=${safeId}">${isDraft?'Continue Editing':'Edit'}</a>
      ${!isDraft?`<a class="char-btn" href="tracker.html?sandbox=true&char=${safeId}">Sandbox</a>`:''}
      ${!isDraft?`<button class="char-btn" onclick="duplicateChar('${safeId}')" title="Duplicate character" style="padding:5px 8px;">⎘</button>`:''}
      <button class="char-btn char-btn-del" onclick="deleteChar('${safeId}','${safeName}')" title="Delete character"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="5" x2="15" y2="5"/><path d="M7 5V3.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V5"/><path d="M4.5 5l.8 9.5a1 1 0 0 0 1 .9h5.4a1 1 0 0 0 1-.9L13.5 5"/><line x1="7" y1="8.5" x2="7" y2="12"/><line x1="11" y1="8.5" x2="11" y2="12"/></svg></button>
    </div>
  </div>`;
}

function render(){
  const grid=document.getElementById('charGrid');
  let chars=[];
  try{chars=CharStore.index().sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0));}catch(e){}
  if(!chars.length){
    grid.innerHTML=`<div class="empty">
      <div class="empty-icon">📜</div>
      <div class="empty-title">No Characters Yet</div>
      <p class="empty-sub">Create your first character to get started.</p>
      <div class="divider"></div>
      <a class="btn-create" href="builder.html">+ Create Character</a>
    </div>`;
    return;
  }
  try{
    // status undefined = old char before this feature → treat as saved
    const saved=chars.filter(c=>c.status!=='draft');
    const drafts=chars.filter(c=>c.status==='draft');
    let html='';
    if(saved.length){
      html+=`<div class="char-grid">${saved.map(c=>_charCard(c,false)).join('')}</div>`;
    }
    if(drafts.length){
      html+=`<div style="margin-top:2rem;">
        <div style="font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border);">Drafts</div>
        <div class="char-grid">${drafts.map(c=>_charCard(c,true)).join('')}</div>
      </div>`;
    }
    if(!saved.length){
      html=`<div class="empty" style="margin-bottom:1.5rem;">
        <div class="empty-icon">📜</div>
        <div class="empty-title">No Saved Characters</div>
        <p class="empty-sub">Finish a draft and save it to play in campaigns.</p>
        <div class="divider"></div>
        <a class="btn-create" href="builder.html">+ Create Character</a>
      </div>`+html;
    }
    grid.innerHTML=html;
  }catch(e){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Error loading characters</div><p class="empty-sub" style="color:var(--red);">${e.message}</p></div>`;
  }
}

async function _deleteCloudChar(id){
  if(!_sb)return;
  try{
    const{data:{session}}=await _sb.auth.getSession();
    if(!session)return;
    await _sb.from('characters').delete().eq('local_id',id).eq('user_id',session.user.id);
  }catch(e){}
}

function deleteChar(id,name){
  if(!confirm('Delete "'+name+'" permanently? This cannot be undone.'))return;
  CharStore.delete(id);
  render();
  _populateNavCharMenu();
  _deleteCloudChar(id);
}

function duplicateChar(id){
  const meta=CharStore.index().find(c=>c.id===id);
  if(!meta)return;
  const fullData=CharStore.loadFull(id);
  // Generate unique name: "Name (2)", "Name (3)", ...
  const allNames=CharStore.index().map(c=>c.name||'Unnamed');
  const baseName=meta.name||'Unnamed';
  let newName=baseName+' (2)';
  let n=2;
  while(allNames.includes(newName)){n++;newName=baseName+' ('+n+')';}
  const newId=CharStore.genId();
  const now=new Date().toISOString();
  // Duplicate index entry
  const newMeta={...meta,id:newId,name:newName,updatedAt:now};
  CharStore._saveIdx([...CharStore.index(),newMeta]);
  // Duplicate full data if present
  if(fullData){
    const newData=JSON.parse(JSON.stringify(fullData));
    // Update all embedded name/id references
    if(newData.builder){
      if(newData.builder.identity)newData.builder.identity.name=newName;
      newData.builder.charId=newId;
    }
    if(newData.tracker){
      if(newData.tracker.identity)newData.tracker.identity.name=newName;
      newData.tracker._charId=newId;
    }
    CharStore.saveFull(newId,newData);
  }
  render();
  _populateNavCharMenu();
}

// ── Nav char dropdown ─────────────────────────────────────────────────────────
function _populateNavCharMenu(){
  const menu=document.getElementById('navCharMenu');
  if(!menu)return;
  const footer=`<a href="builder.html" class="nav-char-footer">+ Create Character</a><a href="characters.html" class="nav-char-footer">View All →</a>`;
  let chars=[];
  try{chars=CharStore.index().filter(c=>c.status!=='draft').sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0));}catch(e){}
  if(!chars.length){
    menu.innerHTML=`<div class="nav-char-empty">No saved characters yet</div>${footer}`;
    return;
  }
  try{
    menu.innerHTML=chars.slice(0,8).map(c=>{
      const cl=_clsLabel(c.classId);
      return`<div class="nav-char-tile">
        <div class="nav-char-info">
          <div class="nav-char-name">${c.name||'Unnamed'}</div>
          <div class="nav-char-sub">${cl?cl+' \xb7 ':''}Lv ${c.level||1}</div>
        </div>
        <div class="nav-char-actions">
          <a href="builder.html?char=${c.id||''}" class="nav-char-action">Edit</a>
          <a href="tracker.html?sandbox=true&char=${c.id||''}" class="nav-char-action">Sandbox</a>
        </div>
      </div>`;
    }).join('')+footer;
  }catch(e){
    menu.innerHTML=`<div class="nav-char-empty">Error loading characters</div>${footer}`;
  }
}
function toggleNavCharMenu(e){
  e&&e.stopPropagation();
  const menu=document.getElementById('navCharMenu');
  if(!menu)return;
  const isOpen=menu.classList.contains('open');
  document.querySelectorAll('.nav-char-menu.open').forEach(m=>m.classList.remove('open'));
  if(!isOpen){_populateNavCharMenu();menu.classList.add('open');}
}
document.addEventListener('click',()=>{
  document.querySelectorAll('.nav-char-menu.open').forEach(m=>m.classList.remove('open'));
});

const THEME_LIST=[
  {id:'parchment',color:'#f0dfa0',label:'Parchment'},
  {id:'midnight',color:'#3a3a5c',label:'Midnight'},
  {id:'arcane',color:'#6a3d9a',label:'Arcane'},

];
function setTheme(id){
  document.documentElement.setAttribute('data-theme',id);
  localStorage.setItem('dnd5e_theme',id);
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===id));
}
function initTheme(){
  const saved=localStorage.getItem('dnd5e_theme')||'parchment';
  document.documentElement.setAttribute('data-theme',saved);
  const el=document.getElementById('themeDots');
  if(el)el.innerHTML=THEME_LIST.map(t=>`<div class="theme-dot${saved===t.id?' active':''}" data-theme="${t.id}" title="${t.label}" style="background:${t.color};" onclick="setTheme('${t.id}')"></div>`).join('');
}

// ── AUTH WALL ──────────────────────────────────────────────────────────────────
let _wallMode='signin';
function _showAuthWall(){const w=document.getElementById('authWall');if(w)w.classList.remove('hidden');}
function _hideAuthWall(){const w=document.getElementById('authWall');if(w)w.classList.add('hidden');}
function _renderWall(){
  document.querySelectorAll('#authWall .auth-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===_wallMode));
  const btn=document.getElementById('wallAuthBtn');if(btn)btn.textContent=_wallMode==='signin'?'Sign In':'Create Account';
  const msg=document.getElementById('wall-msg');if(msg)msg.textContent='';
}
async function doWallAuth(){
  if(!_sb){showToast('Auth service not available.','warning');return;}
  const email=document.getElementById('wall-email')?.value?.trim();
  const pass=document.getElementById('wall-pass')?.value;
  const msg=document.getElementById('wall-msg');
  if(!email||!pass){if(msg)msg.textContent='Enter email and password.';return;}
  if(msg)msg.textContent='';
  const{error}=_wallMode==='signin'
    ?await _sb.auth.signInWithPassword({email,password:pass})
    :await _sb.auth.signUp({email,password:pass});
  if(error){if(msg)msg.textContent=error.message;return;}
  if(_wallMode==='signup'){if(msg)msg.style.color='var(--green)';if(msg)msg.textContent='Account created — check your email to confirm.';return;}
  // onAuthStateChange fires SIGNED_IN → hides wall automatically
}

const SUPABASE_URL='https://vjwefnkgclkczfwkvqis.supabase.co';
const SUPABASE_KEY='sb_publishable_pDMmhqzBWnSYqNYC9m0KaA_2R3haySF';
let _sb=null;
// _sb initialized in initSupa() once the CDN script loads below
function initSupa(){
  try{if(typeof supabase!=='undefined')_sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){}

  _sb.auth.onAuthStateChange((event,session)=>{

// Add upsertMeta to CharStore
CharStore.upsertMeta=function(meta){
  const arr=this._idx();const i=arr.findIndex(c=>c.id===meta.id);
  if(i>=0)arr[i]={...arr[i],...meta};else arr.push(meta);
  this._saveIdx(arr);
};

function showToast(msg,type='info'){
  let c=document.getElementById('toast-container');
  if(!c){c=document.createElement('div');c.id='toast-container';c.style.cssText='position:fixed;bottom:1rem;right:1rem;display:flex;flex-direction:column;gap:6px;z-index:9999;';document.body.appendChild(c);}
  const t=document.createElement('div');
  t.style.cssText='background:#2c2416;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;font-family:inherit;max-width:280px;';
  if(type==='warning')t.style.background='#8b6914';
  if(type==='success')t.style.background='#2d7a2d';
  t.textContent=msg;c.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

async function _pullCloudChars(){
  if(!_sb)return;
  try{
    const{data:{session}}=await _sb.auth.getSession();
    if(!session)return;
    const{data,error}=await _sb.from('characters').select('local_id,name,class_id,level,updated_at').eq('user_id',session.user.id);
    if(error||!data||!data.length)return;
    data.forEach(row=>{
      if(!row.local_id)return;
      CharStore.upsertMeta({id:row.local_id,name:row.name||'Unnamed',classId:row.class_id||null,level:row.level||1,updatedAt:row.updated_at||null});
    });
    render();
    _populateNavCharMenu();
  }catch(e){}
}

function renderAuthBar(){
  const el=document.getElementById('authBar');if(!el)return;
  // Show button immediately — update once session resolves
  el.innerHTML=`<div class="auth-bar"><button class="btn btn-gold btn-sm" onclick="openAuthModal()">☁ Sign In</button></div>`;
  if(!_sb)return;
  _sb.auth.getSession().then(({data:{session}})=>{
    if(!session)return;
    el.innerHTML=`<div class="auth-bar"><span class="auth-email">${session.user.email}</span><button class="btn btn-ghost btn-sm" onclick="signOut()">Sign Out</button></div>`;
  }).catch(()=>{});
}

let _authMode='signin';
function openAuthModal(){
  let el=document.getElementById('auth-modal-root');
  if(!el){el=document.createElement('div');el.id='auth-modal-root';document.body.appendChild(el);}
  _renderAuthModal();
}
function _renderAuthModal(){
  const el=document.getElementById('auth-modal-root');if(!el)return;
  el.innerHTML=`<div class="auth-overlay" onclick="if(event.target===this)closeAuthModal()">
    <div class="auth-modal">
      <h3>☁ Sign In</h3>
      <div class="auth-tabs">
        <button class="auth-tab${_authMode==='signin'?' active':''}" onclick="_authMode='signin';_renderAuthModal()">Sign In</button>
        <button class="auth-tab${_authMode==='signup'?' active':''}" onclick="_authMode='signup';_renderAuthModal()">Create Account</button>
      </div>
      <div class="auth-field"><label>Email</label><input type="email" id="auth-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')document.getElementById('auth-pass').focus()"/></div>

      </div>
    </div>

  setTimeout(()=>{const i=document.getElementById('auth-email');if(i)i.focus();},50);
}
function closeAuthModal(){const el=document.getElementById('auth-modal-root');if(el)el.innerHTML='';}
async function doAuth(){
  const email=document.getElementById('auth-email')?.value?.trim();
  const pass=document.getElementById('auth-pass')?.value;
  if(!email||!pass){showToast('Enter email and password.','warning');return;}
  const{error}=_authMode==='signin'
    ?await _sb.auth.signInWithPassword({email,password:pass})
    :await _sb.auth.signUp({email,password:pass});
  if(error){showToast(error.message,'warning');return;}
  closeAuthModal();
  renderAuthBar();
  showToast(_authMode==='signin'?'Signed in! Loading characters...':'Account created — check your email.','success');
  if(_authMode==='signin')_pullCloudChars();
}
async function signOut(){
  if(_sb)await _sb.auth.signOut();
  location.href='index.html';
}
